name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.19.x', '22.x']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and validate the domain adaptation rehearsal
        run: npm run adaptation:check

      - name: Regenerate Custom Elements Manifest
        run: npm run manifest

      - name: Run offline Codex evaluator
        run: npm run eval:codex:offline

      - name: Run structured specs
        run: npm run eval:specs

      - name: Render and run generated Vitest specs
        run: npm run eval:specs:vitest

      - name: Verify package identity
        run: node -e "const pkg = require('./package.json'); if (pkg.name !== '@ovlira/cli' || pkg.bin?.ovlira !== 'dist/cli/bin.js') process.exit(1)"

      - name: Inspect package contents
        run: npm run pack:check

      - name: Verify fresh installation of both packed packages
        run: npm run package:smoke

  ui:
    name: Browser and visual gates
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Chromium
        run: npx playwright install chromium

      - name: Build visual authority, fixture harness, and marketing side
        run: npm run build && npm run reference:design:build && npm run review:visual:build && npm run marketing:build

      - name: Run interactions, accessibility, responsive, and screenshot gates
        run: npm run test:ui && npm run test:component-visual
