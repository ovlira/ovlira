name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.19.x', '22.x']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Regenerate Custom Elements Manifest
        run: npm run manifest

      - name: Run offline Codex evaluator
        run: npm run eval:codex:offline

      - name: Verify package identity
        run: node -e "const pkg = require('./package.json'); if (pkg.name !== '@ovlira/cli' || pkg.bin?.ovlira !== 'dist/cli/index.js') process.exit(1)"

      - name: Inspect package contents
        run: npm pack --dry-run
