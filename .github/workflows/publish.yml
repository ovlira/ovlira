name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag to publish, for example v0.3.0
        required: true
        default: v0.3.0

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org

      - name: Use trusted-publishing-compatible npm
        run: |
          npm install --global 'npm@^11.5.1'
          node --version
          npm --version

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: node -e "const pkg = require('./package.json'); const tag = process.env.RELEASE_TAG.replace(/^v/, ''); if (pkg.version !== tag) throw new Error('package.json version ' + pkg.version + ' does not match release tag ' + tag)"

      - name: Install dependencies
        run: npm ci

      - name: Run package release checks
        run: npm run release:check:package

      - name: Regenerate Custom Elements Manifest
        run: npm run manifest

      - name: Publish with trusted provenance
        run: npm publish --access public
