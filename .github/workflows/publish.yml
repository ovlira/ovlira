name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "const pkg = require('./package.json'); const tag = process.env.RELEASE_TAG.replace(/^v/, ''); if (pkg.version !== tag) throw new Error('package.json version ' + pkg.version + ' does not match release tag ' + tag)"

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm test

      - name: Regenerate Custom Elements Manifest
        run: npm run manifest

      - name: Publish with provenance
        run: npm publish --provenance --access public
